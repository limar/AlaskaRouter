# Baked into the AlaskaRouter render image (AlaskaRouter-msgi).
# The base image creates this at first run in the ephemeral layer, so a container
# recreate loses it and PostgreSQL won't boot. Baking it makes recreate safe.
#
# PostgreSQL is NOT published outside the container (the osm2pgsql sidecar reaches
# it via the container's network namespace on 127.0.0.1), so localhost/socket +
# docker-subnet trust is safe and matches how the render backend and importer
# connect.
#
# TYPE  DATABASE  USER  ADDRESS         METHOD
local   all       all                   trust
host    all       all   127.0.0.1/32    trust
host    all       all   ::1/128         trust
host    all       all   172.16.0.0/12   trust
