services:
  otm-docker:
    # Our thin image over the digest-pinned upstream stack (AlaskaRouter-msgi):
    # bakes the /etc/postgresql config + python-gdal so a recreate doesn't break
    # PostgreSQL. `docker compose up --build` builds it from docker/otm-render.
    image: ${OTM_DOCKER_IMAGE:-alaskarouter/otm-render:2026-06-10}
    build:
      context: ../docker/otm-render
    container_name: ${OTM_CONTAINER_NAME:-alaskarouter-otm}
    restart: unless-stopped
    environment:
      LETSENCRYPT: "0"
      EMAIL: ${OTM_EMAIL:-admin@localhost}
      DOMAIN: ${OTM_DOMAIN:-localhost}
      WHITELIST: ${OTM_WHITELIST:-127.0.0.1}
      MOD_TILE_PREVENT_EXPIRATION: "1"
    ports:
      # Bind localhost-only on a non-vital host port. Port 8080 is reserved for
      # other services on the shared render host, and the tile server must not be
      # exposed on 0.0.0.0. Reach tiles at http://127.0.0.1:8088/otm.
      - "127.0.0.1:${OTM_HTTP_PORT:-8088}:80"
    volumes:
      - ../data/docker/data:/mnt/data
      - ../data/osm:/osm:ro
      - ../data/docker/tablespace:/mnt/db
      - ../data/docker/db:/var/lib/postgresql
      - ../data/docker/letsencrypt:/etc/letsencrypt
      - ../scripts:/alaskarouter-scripts:ro
